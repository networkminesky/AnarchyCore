# =========================================================
#             Configuração da LocatorAPI (Folia)
# =========================================================

# Mundos onde a Locator Bar ficará SEMPRE LIGADA por padrão.
always-enabled-worlds: []

# Mundos onde a Locator Bar ficará SEMPRE DESLIGADA por padrão.
always-disabled-worlds: []

# Modo para mundos não listados acima (ENABLED ou DISABLED)
default-world-mode: "ENABLED"

# Ativar mensagens de debug no console (útil para testes de pacotes)
debug: false

# =========================================================
#             FeedbackAPI (action bar)
# =========================================================

feedback:
  # Caracteres visíveis por "slide" no action bar
  max-chars-per-part: 64
  # Tempo (ticks) que cada parte fica na tela
  ticks-per-part: 40
  # Pausa entre mensagens completas na fila
  ticks-between-messages: 5
  # Envia a mesma mensagem no chat do jogador ao exibir no action bar
  mirror-to-chat: true

# =========================================================
#             Sons de feedback (plugin inteiro)
# =========================================================

sounds:
  volume: 0.8
  pitch: 1.0
  error: BLOCK_NOTE_BLOCK_DIDGERIDOO
  success: BLOCK_NOTE_BLOCK_CHIME
  tell:
    enabled: true
    sound: BLOCK_NOTE_BLOCK_BELL

# =========================================================
#             Antiflood do chat
# =========================================================

chat:
  antiflood:
    enabled: true
    # Máximo de mensagens permitidas dentro da janela
    max-messages: 2
    # Janela em milissegundos
    window-ms: 2000

# =========================================================
#             TPA / TPAHERE (Folia)
# =========================================================

tpa:
  countdown-seconds: 5
  move-threshold: 0.5
  request-expire-seconds: 120
  sounds:
    volume: 0.8
    pitch: 1.0
    countdown-tick: BLOCK_NOTE_BLOCK_HAT

# =========================================================
#             Warps (Folia)
# =========================================================

warps:
  list-header-icon: RED_BED
  countdown-seconds: 5
  move-threshold: 0.5
  sounds:
    volume: 0.8
    pitch: 1.0
    countdown-tick: BLOCK_NOTE_BLOCK_HAT

# =========================================================
#             Homes (MariaDB + Folia)
# =========================================================

homes:
  default-limit: 1
  empty-slots-preview: 4
  list-header-icon: BLUE_BED
  default-home-icon: BLUE_BED
  countdown-seconds: 5
  move-threshold: 0.5
  sounds:
    volume: 0.8
    pitch: 1.0
    countdown-tick: BLOCK_NOTE_BLOCK_HAT
  groups:
    vip:
      permission: anarchycore.home.group.vip
      limit: 5
    mvp:
      permission: anarchycore.home.group.mvp
      limit: 10

# =========================================================
#             MariaDB / preferências de jogador
# =========================================================

database:
  enabled: true
  jdbc-url: "jdbc:mariadb://127.0.0.1:3306/anarchycore?useUnicode=true&characterEncoding=utf8"
  username: root
  password: ""
  pool-size: 10
  connection-timeout-ms: 10000
