# =========================================================
#             Configuração da LocatorAPI (Folia)
# =========================================================

# Mundos onde a Locator Bar ficará SEMPRE LIGADA por padrão.
always-enabled-worlds: []

# Mundos onde a Locator Bar ficará SEMPRE DESLIGADA por padrão.
always-disabled-worlds: []

# Modo para mundos não listados acima (ENABLED ou DISABLED)
default-world-mode: "ENABLED"

# Ativar mensagens de debug no console (útil para testes de pacotes)
debug: false

# =========================================================
#             Blocos interativos (blocks.yml)
# =========================================================

blocks:
  # Cooldown padrão entre acionamentos do mesmo bloco (ms)
  default-cooldown-ms: 1000
  # Intervalo global de partículas (ticks); só blocos com partículas e jogador próximo
  particle-period-ticks: 10
  # Distância máxima para spawnar partículas (blocos)
  particle-view-distance: 32

# =========================================================
#             FeedbackAPI (action bar)
# =========================================================

feedback:
  # Caracteres visíveis por "slide" no action bar
  max-chars-per-part: 64
  # Tempo (ticks) entre partes de uma mesma mensagem longa (slide). Mensagens curtas/únicas não esperam.
  ticks-per-part: 40
  # Pausa opcional entre mensagens distintas na fila (0 = imediato). Não afeta slides.
  ticks-between-messages: 0
  # Envia a mesma mensagem no chat do jogador ao exibir no action bar
  mirror-to-chat: true

# =========================================================
#             Sons de feedback (plugin inteiro)
# =========================================================

sounds:
  volume: 0.8
  pitch: 1.0
  error: BLOCK_NOTE_BLOCK_DIDGERIDOO
  success: BLOCK_NOTE_BLOCK_CHIME
  tell:
    enabled: true
    sound: BLOCK_NOTE_BLOCK_BELL
  broadcast:
    enabled: true
    sound: ENTITY_EXPERIENCE_ORB_PICKUP

# =========================================================
#             Antiflood do chat
# =========================================================

chat:
  antiflood:
    enabled: true
    # Máximo de mensagens permitidas dentro da janela
    max-messages: 2
    # Janela em milissegundos
    window-ms: 2000

# =========================================================
#             TPA / TPAHERE (Folia)
# =========================================================

tpa:
  countdown-seconds: 5
  move-threshold: 0.5
  request-expire-seconds: 120
  sounds:
    volume: 0.8
    pitch: 1.0
    countdown-tick: BLOCK_NOTE_BLOCK_HAT

# =========================================================
#             Warps (Folia)
# =========================================================

warps:
  list-header-icon: RED_BED
  countdown-seconds: 5
  move-threshold: 0.5
  sounds:
    volume: 0.8
    pitch: 1.0
    countdown-tick: BLOCK_NOTE_BLOCK_HAT

# =========================================================
#             Homes (MariaDB + Folia)
# =========================================================

homes:
  default-limit: 1
  empty-slots-preview: 4
  list-header-icon: BLUE_BED
  default-home-icon: BLUE_BED
  countdown-seconds: 5
  move-threshold: 0.5
  sounds:
    volume: 0.8
    pitch: 1.0
    countdown-tick: BLOCK_NOTE_BLOCK_HAT
  groups:
    vip:
      permission: anarchycore.home.group.vip
      limit: 5
    mvp:
      permission: anarchycore.home.group.mvp
      limit: 10

# =========================================================
#             MariaDB / preferências de jogador
# =========================================================

leaderboards:
  weekly:
    # Fuso ISO para a chave da semana (ex.: 2026-W47) do ranking semanal.
    zone: "America/Sao_Paulo"

database:
  enabled: true
  jdbc-url: "jdbc:mariadb://127.0.0.1:3306/anarchycore?useUnicode=true&characterEncoding=utf8"
  username: root
  password: ""
  pool-size: 10
  connection-timeout-ms: 10000

# =========================================================
#             Sistema de Convite / Indicação
# =========================================================

referral:
  enabled: true
  code:
    # Alfabeto do código permanente. 0/O e 1/I/L são removidos mesmo se entrarem aqui.
    charset: "23456789ABCDEFGHJKMNPQRSTUVWXYZ"
    length: 8
    max-generation-attempts: 20
  security:
    # Só resgata se first_join (tabela própria, não o vanilla) for mais recente que isto.
    new-account-max-age-hours: 24
    # Cruza todo o histórico, não só o IP da sessão atual.
    check-same-ip: true
    check-same-subnet: true
    ipv4-slash24: true
    ipv6-slash64: true
    # Resgates distintos (não logins) cuja conta já apareceu nesta sub-rede.
    max-redemptions-per-subnet: 1
    # 1 = só o ciclo direto A↔B. Valores maiores sobem a cadeia de indicadores.
    cycle-depth: 16
    # Cooldown entre tentativas de /convite usar (brute-force).
    redeem-cooldown-seconds: 5
  custom-code:
    enabled: true
    permission: "anarchycore.referral.customcode"
    # Aplicado depois de trim + maiúsculas. Espaço, & e tags (< >) são recusados mesmo se o regex mudar.
    pattern: "^[A-Z0-9_-]{3,16}$"
    min-length: 3
    max-length: 16
    # A primeira definição não espera cooldown. As seguintes respeitam este intervalo.
    change-cooldown-seconds: 86400
    # 0 = sem limite. Cada definição bem-sucedida consome uma troca.
    max-changes: 5
    reserved:
      - USAR
      - USE
      - RESGATAR
      - STATUS
      - INFO
      - DEFINIR
      - CUSTOM
      - SET
      - CODIGO
      - CODE
      - ADMIN
    blacklist:
      - STAFF
      - ADMIN
      - MODERADOR
      - DONO
      - OWNER
      - HACK
      - HACKER
      - PORNO
      - PUTA
      - MERDA
  first-join-dialog:
    enabled: true
    # Espera o cliente Java/Bedrock terminar de carregar. Folia: player.getScheduler().runDelayed.
    delay-ticks: 30
    title: "&#7BED9FConvite"
    body: "&7Se alguém te convidou, digite o código abaixo. Você também pode usar &f/convite usar <codigo>&7 dentro do prazo."
    input-label: "&fCódigo de convite"
    input-placeholder: "CODIGO"
    confirm-button: "&#7BED9FResgatar"
    skip-button: "&7Não tenho código"
  qualification:
    # Prazo para sair de PENDING. Depois disso vira EXPIRED, sem pagamento.
    deadline-days: 7
    # Playtime só conta com movimento, quebra, colocação ou interação recente.
    min-active-playtime-minutes: 120
    min-distance: 5000.0
    min-blocks-mined: 100
    min-blocks-placed: 25
    afk-timeout-seconds: 120
  rewards:
    # Fragmentos (shards). O crédito só ocorre depois da qualificação.
    referrer-shards: 50
    invitee-bonus-shards: 10
  caps:
    # Conta PENDING, qualificado, pagamento em andamento, falha e já pago.
    per-day: 5
    per-week: 20
    total: 200
