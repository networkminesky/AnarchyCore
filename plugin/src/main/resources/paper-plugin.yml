name: AnarchyCore
version: '${version}'
main: anarchy.minesky.core.AnarchyCore
bootstrapper: anarchy.minesky.core.AnarchyCoreBootstrap
api-version: '26.3'
folia-supported: true
description: MineSky AnarchyCore

dependencies:
  server:
    packetevents:
      load: BEFORE
      required: true
      join-classpath: true
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    SkinsRestorer:
      load: BEFORE
      required: false
      join-classpath: true

permissions:
  anarchycore.convite:
    description: Usar /convite — gerar e resgatar códigos de indicação
    default: true
  anarchycore.convite.admin:
    description: Comandos admin do sistema de convites
    default: op
  anarchycore.referral.customcode:
    description: Permite definir um código de convite personalizado (/convite definir)
    default: false
