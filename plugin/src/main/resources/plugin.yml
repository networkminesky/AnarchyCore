name: AnarchyCore
version: '${version}'

main: anarchy.minesky.core.AnarchyCore
api-version: '26.3'
load: POSTWORLD
depend:
  - packetevents
softdepend:
  - PlaceholderAPI
  - floodgate
  - ProtocolLib
  - ViaVersion
  - SkinsRestorer
  - ViaBackwards
  - ViaRewind
  - Geyser-Spigot

folia-supported: true

permissions:
  anarchycore.admin:
    description: Bypass AnarchyCore admin restrictions and plugin inspection commands
    default: op
  anarchycore.ping.others:
    description: Permite ver o ping de outros jogadores com /ping
    default: op
  anarchycore.tempojogo.others:
    description: Permite ver o tempo de jogo de outros jogadores com /tempojogo
    default: op
  anarchycore.stats.others:
    description: Permite ver o perfil de outros jogadores com /stats <jogador>
    default: op
  anarchycore.reload:
    description: Permite recarregar config.yml e messages.yml com /anarchycore reload
    default: op
  anarchycore.tpa.bypasstimer:
    description: Ignora a espera de 5 segundos parado ao teleportar por TPA
    default: op
  anarchycore.warp.bypasstimer:
    description: Ignora a espera de 5 segundos parado ao teleportar por warp
    default: op
  anarchycore.warp.admin:
    description: Permite criar e editar warps com /setwarp e /editwarp
    default: op
  anarchycore.home.bypasstimer:
    description: Ignora a espera de 5 segundos parado ao teleportar para home
    default: op
  anarchycore.home.others:
    description: Permite /home jogador:id para visitar homes de outros
    default: op
  anarchycore.home.icon:
    description: Permite editar o ícone das homes no menu
    default: true
  anarchycore.chat.bypass:
    description: Ignora o limite de antiflood do chat e não recebe avisos de flood
    default: op
  anarchycore.chat.color:
    description: Permite usar cores no chat (&, &#RRGGBB e MiniMessage)
    default: op
  anarchycore.chat.url:
    description: Permite enviar URLs clicáveis no chat
    default: op
  anarchycore.broadcast:
    description: Permite enviar anúncios globais com /broadcast
    default: op
  anarchycore.itemname:
    description: Permite alterar o nome de itens na mão com /itemname
    default: op
  anarchycore.lore:
    description: Permite editar a lore de itens na mão com /lore
    default: op
  anarchycore.heal:
    description: Permite usar /heal para restaurar a própria vida
    default: op
  anarchycore.heal.others:
    description: Permite usar /heal em outros jogadores
    default: op
  anarchycore.tp:
    description: Permite /tp <jogador> para ir até outro jogador
    default: op
  anarchycore.tp.others:
    description: Permite /tp <origem> <destino> para teleportar um jogador até outro
    default: op
  anarchycore.tphere:
    description: Permite /tphere <jogador> para puxar um jogador até você
    default: op
  anarchycore.give:
    description: Permite /i <item> [quantidade] para receber itens
    default: op
  anarchycore.gamemode:
    description: Permite /gm, /gmc, /gms, /gma e /gmsp no próprio jogador
    default: op
  anarchycore.gamemode.others:
    description: Permite alterar o gamemode de outros jogadores
    default: op
  anarchycore.nv:
    description: Permite usar /nv para alternar visão noturna
    default: true
  anarchycore.nv.others:
    description: Permite usar /nv em outros jogadores
    default: op
  anarchycore.guard.admin:
    description: Permite /anarchycore guard check, info e history
    default: op
  anarchycore.guard.bypass:
    description: Ignora verificação AnarchyGuard no join
    default: op
  anarchycore.guard.fog.bypass:
    description: Enxerga jogadores através do Fog of War
    default: op
  anarchycore.friends:
    description: Usar /amigo — lista, adicionar e remover amigos
    default: true
  anarchycore.convite:
    description: Usar /convite — gerar e resgatar códigos de indicação
    default: true
  anarchycore.convite.admin:
    description: Comandos admin do sistema de convites (/anarchycore convite ...)
    default: op
  anarchycore.blocks.admin:
    description: Comandos admin de blocos interativos (/anarchycore blocks ...)
    default: op
  anarchycore.materialpicker.operative:
    description: Ver itens operativos (command blocks, spawn eggs, barrier, etc.) no seletor de materiais
    default: op
  anarchycore.referral.customcode:
    description: Permite definir um código de convite personalizado (/convite definir)
    default: false
  anarchycore.menu:
    description: Abre o hub do servidor (/menu) — equivalente ao menu ESC
    default: true
  anarchycore.seen:
    description: Consulta quando um jogador entrou ou saiu (/seen)
    default: true
  anarchycore.seen.vanish:
    description: Vê jogadores em vanish como online no /seen e no tab-complete
    default: op
  anarchycore.otp:
    description: Teleporta até o último logout de um jogador offline (/otp)
    default: op
