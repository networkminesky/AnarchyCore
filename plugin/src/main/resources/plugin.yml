name: AnarchyCore
version: '${version}'

main: anarchy.minesky.core.AnarchyCore
bootstrapper: anarchy.minesky.core.AnarchyCoreBootstrap
api-version: '26.3'
load: POSTWORLD
softdepend:
  - floodgate

folia-supported: true

commands:
  ping:
    description: Mostra seu ping ou o de outro jogador
    usage: /ping [jogador]
  tell:
    description: Envia mensagem privada
    usage: /tell <jogador> [mensagem]
    aliases: [msg, w, whisper]
  r:
    description: Responde a última mensagem privada
    usage: /r <mensagem>
    aliases: [reply]
  anarchycore:
    description: Comandos administrativos do AnarchyCore
    usage: /anarchycore reload
    aliases: [acore, minesky]
  tpa:
    description: Pede teleporte até um jogador
    usage: /tpa <jogador>
  tpaqui:
    description: Pede para puxar um jogador até você
    usage: /tpaqui <jogador>
    aliases: [tpahere]
  tpaceitar:
    description: Aceita um pedido de TPA
    usage: /tpaceitar [jogador]
    aliases: [tpaccept]
  tpanegar:
    description: Nega um pedido de TPA
    usage: /tpanegar [jogador]
    aliases: [tpdeny]
  tpauto:
    description: Aceita pedidos de TPA automaticamente
    usage: /tpauto [on|off]
  warp:
    description: Lista ou teleporta para uma warp
    usage: /warp [id]
    aliases: [warps]
  spawn:
    description: Teleporta para a warp spawn
    usage: /spawn
  setwarp:
    description: Cria uma warp na sua posição
    usage: /setwarp <id>
  editwarp:
    description: Edita nome e ícone de uma warp
    usage: /editwarp <id>
  home:
    description: Lista ou teleporta para uma home
    usage: /home [id|jogador:id]
    aliases: [homes]
  sethome:
    description: Cria ou atualiza uma home
    usage: /sethome <id>
  delhome:
    description: Remove uma home
    usage: /delhome <id>
  config:
    description: Abre suas preferências MineSky
    usage: /config
    aliases: [configurar, personalizar, preferencias, settings]

permissions:
  anarchycore.admin:
    description: Bypass AnarchyCore admin restrictions and plugin inspection commands
    default: op
  anarchycore.ping.others:
    description: Permite ver o ping de outros jogadores com /ping
    default: op
  anarchycore.reload:
    description: Permite recarregar config.yml e messages.yml com /anarchycore reload
    default: op
  anarchycore.tpa.bypasstimer:
    description: Ignora a espera de 5 segundos parado ao teleportar por TPA
    default: op
  anarchycore.warp.bypasstimer:
    description: Ignora a espera de 5 segundos parado ao teleportar por warp
    default: op
  anarchycore.warp.admin:
    description: Permite criar e editar warps com /setwarp e /editwarp
    default: op
  anarchycore.home.bypasstimer:
    description: Ignora a espera de 5 segundos parado ao teleportar para home
    default: op
  anarchycore.home.others:
    description: Permite /home jogador:id para visitar homes de outros
    default: op
  anarchycore.home.icon:
    description: Permite editar o ícone das homes no menu
    default: true
  anarchycore.chat.bypass:
    description: Ignora o limite de antiflood do chat e não recebe avisos de flood
    default: op